name: HALIX Assembler CI

on:
  push:
    branches: [ "main", "develop", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile assembler
        run: g++ -std=c++17 -Wall -Wextra -o halixAssembler halixAssembler.cpp
      - name: Run full test suite (70 tests)
        run: bash tests/run_all_tests.sh
      - name: End-to-end assembly check
        run: |
          cat > e2e.hal << 'HALEOF'
          .ALLOC 3
          x .DATA =10
          y .DATA =3
          z .DATA
          .BEGIN
          LOAD x
          ADD y
          STORE z
          HALT
          .END
          HALEOF
          ./halixAssembler e2e.hal
          grep -q "NO errors" e2e.log && echo "PASS: no errors"
          [ "$(sed -n '2p' e2e.hlx)" = "0300" ] && echo "PASS: LOAD x=0300"
          [ "$(sed -n '3p' e2e.hlx)" = "0501" ] && echo "PASS: ADD y=0501"
          [ "$(sed -n '5p' e2e.hlx)" = "9900" ] && echo "PASS: HALT=9900"
          [ "$(sed -n '9p' e2e.hlx)" = "9999" ] && echo "PASS: uninit=9999"
      - name: Execute .hlx on halix.crun
        run: |
          chmod +x halix.crun
          ./halixAssembler first.hal
          echo "5" | ./halix.crun first.hlx > output.txt
          cat output.txt
          grep -q "0015" output.txt \
            && echo "PASS: halix.crun output correct (5 x 3 = 15)" \
            || (echo "FAIL: unexpected output" && cat output.txt && exit 1)
